name: CI

# PR と main への push で typecheck / lint / unit test を回す。
# Windows と Linux の両方で走らせて、プラットフォーム依存バグを早期検出する。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: TypeScript test config check
        run: npm run typecheck:tests
        # P0-5: 現在 exit 0 で安定しているためブロッキング化。リリースゲート
        #   (verify-release-readiness.ts 等) 自身の型崩れを CI で検出する。

      - name: Lint
        run: npm run lint
        continue-on-error: true  # 段階移行中。warning のみで fail させない

      - name: Unit tests
        run: npm run test:unit
